name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: the security-check job (called workflow) only reads.
# This job needs contents: write to create a GitHub Release.
permissions:
  contents: read

jobs:
  # Reuse the exact same security checks from the CI workflow.
  security:
    uses: ./.github/workflows/ci.yml

  release:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create release archive
        # Package the compiled build output together with runtime files.
        run: |
          mkdir -p release
          cp -r dist release/dist
          cp package.json release/package.json
          cp package-lock.json release/package-lock.json
          tar -czf baseline-security-in-ci-${{ github.ref_name }}.tar.gz -C release .
          ls -la baseline-security-in-ci-${{ github.ref_name }}.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: baseline-security-in-ci-${{ github.ref_name }}.tar.gz
          body: |
            Release ${{ github.ref_name }}

            This release was created only after all security checks passed in the
            reusable CI workflow (`ci.yml`).
